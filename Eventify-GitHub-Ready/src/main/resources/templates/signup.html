<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Sign Up - Eventify</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

/* GLOBAL */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
background:linear-gradient(135deg,#0f0f1a,#1e1b4b);
color:white;
}

/* SPLIT */
.left{
flex:1;
background:
linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.9)),
url("https://images.unsplash.com/photo-1506157786151-b8491531f063") center/cover;
display:flex;
flex-direction:column;
justify-content:center;
padding:60px;
}

.left h1{font-size:40px;}
.left p{opacity:0.8;margin-top:10px;}

/* RIGHT */
.right{
flex:1;
display:flex;
justify-content:center;
align-items:center;
}

/* CARD */
.card{
width:380px;
padding:35px;
border-radius:20px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(15px);
box-shadow:0 10px 40px rgba(0,0,0,0.5);
animation:fadeIn 0.8s ease;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}

/* INPUT */
.input-box{
position:relative;
margin:20px 0;
}

.input-box input{
width:100%;
padding:12px;
background:transparent;
border:none;
border-bottom:2px solid #aaa;
color:white;
outline:none;
}

.input-box label{
position:absolute;
top:12px;
left:0;
font-size:14px;
color:#aaa;
transition:0.3s;
}

.input-box input:focus ~ label,
.input-box input:valid ~ label{
top:-10px;
font-size:12px;
color:#ff2ea6;
}

/* OPTIONS */
.options{
font-size:13px;
margin-top:10px;
}

/* BUTTON */
.btn{
width:100%;
margin-top:20px;
padding:12px;
border:none;
border-radius:30px;
background:linear-gradient(90deg,#6d28d9,#ff2ea6);
color:white;
cursor:pointer;
transition:0.3s;
}

.btn:hover{
transform:scale(1.05);
box-shadow:0 0 20px #ff2ea6;
}

/* SOCIAL */
.social{
margin-top:20px;
text-align:center;
}

.social button{
width:100%;
margin-top:10px;
padding:10px;
border:none;
border-radius:30px;
cursor:pointer;
background:#1e1b4b;
color:white;
transition:0.3s;
}

.social button:hover{
background:#ff2ea6;
}

/* LOGIN */
.login{
text-align:center;
margin-top:20px;
font-size:14px;
}

.login a{
color:#ff2ea6;
text-decoration:none;
}

/* ERROR */
.error{
color:#ef4444;
font-size:13px;
text-align:center;
margin-top:10px;
}

/* ROLE */
.role{
display:flex;
justify-content:space-around;
margin-top:10px;
}

/* FOOTER */
.footer{
position:absolute;
bottom:10px;
width:100%;
text-align:center;
font-size:12px;
opacity:0.6;
}

.footer a{
color:white;
margin:0 10px;
text-decoration:none;
}

/* MOBILE */
@media(max-width:768px){
.left{display:none;}
.right{flex:1;}
}

</style>

</head>

<body>

<!-- LEFT -->
<div class="left">
<h1>Join the Event Experience</h1>
<p>Create, explore, and manage events easily</p>
</div>

<!-- RIGHT -->
<div class="right">

<div class="card">

<h2>Create Account</h2>

<!-- ✅ FIXED FORM (BACKEND CONNECTED) -->
<form th:action="@{/signup}" method="post" th:object="${admin}">

<div class="input-box">
<input type="text" th:field="*{name}" required>
<label>Full Name</label>
</div>

<div class="input-box">
<input type="email" th:field="*{email}" required>
<label>Email Address</label>
</div>

<div class="input-box">
<input type="text" th:field="*{phone}" required>
<label>Phone Number</label>
</div>

<div class="input-box">
<input type="password" th:field="*{password}" required>
<label>Password</label>
</div>

<!-- ROLE -->
<div class="role">
<label><input type="radio" th:field="*{role}" value="USER" checked> User</label>
<label><input type="radio" th:field="*{role}" value="ADMIN"> Admin</label>
</div>

<div class="options">
<label><input type="checkbox" required> I agree to Terms & Conditions</label>
</div>

<button class="btn">Create Account</button>

</form>

<!-- ✅ ERROR MESSAGE FROM CONTROLLER -->
<p class="error" th:text="${error}"></p>

<!-- SOCIAL -->
<div class="social">
<p>or sign up with</p>
<button>Google</button>
<button>Facebook</button>
</div>

<!-- LOGIN -->
<div class="login">
Already have an account? <a href="/signin">Sign In</a>
</div>

</div>

</div>

<!-- FOOTER -->
<div class="footer">
<a href="#">Privacy Policy</a>
<a href="#">Terms</a>
</div>

</body>
</html>
