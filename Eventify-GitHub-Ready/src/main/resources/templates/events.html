<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Events</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins;
}

body{
background:linear-gradient(135deg,#0f0f1a,#1e1b4b);
color:white;
}

/* NAVBAR */
.navbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 8%;
background:rgba(0,0,0,0.6);
backdrop-filter:blur(12px);
}

.navbar h2{color:#ff2ea6;}

.navbar a{
color:white;
margin-left:20px;
text-decoration:none;
}

.navbar a:hover{color:#ff2ea6;}

/* HEADER */
.header{
padding:40px 8%;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
}

.header h1{
font-size:32px;
}

.header p{
opacity:0.7;
margin-top:5px;
}

/* EVENTS */
.events{
padding:20px 8%;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:25px;
}

/* CARD */
.card{
background:rgba(255,255,255,0.05);
border-radius:15px;
overflow:hidden;
position:relative;
backdrop-filter:blur(12px);
transition:0.3s;
}

.card:hover{
transform:translateY(-8px);
box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
}

.card-content{
padding:20px;
}

/* BADGE */
.badge{
position:absolute;
top:10px;
left:10px;
padding:6px 12px;
border-radius:20px;
font-size:12px;
font-weight:bold;
}

.upcoming{ background:#22c55e; }
.completed{ background:#ef4444; }

/* PRICE */
.price{
color:#ff2ea6;
margin-top:5px;
}

/* BUTTON */
.btn{
margin-top:10px;
display:inline-block;
padding:8px 18px;
border-radius:20px;
color:white;
background:linear-gradient(90deg,#6d28d9,#ff2ea6);
border:none;
cursor:pointer;
transition:0.3s;
}

.btn:hover{
transform:scale(1.05);
}

/* ADMIN BUTTONS */
.admin-actions{
margin-top:15px;
display:flex;
gap:10px;
flex-wrap:wrap;
}

.admin-actions form{
display:inline;
}

.btn-green{
background:#22c55e;
}

.btn-red{
background:#ef4444;
}

</style>

</head>

<body>

<!-- ✅ FIXED NAVBAR -->

<div class="navbar">

<h2>Eventify</h2>

<div>
<a href="/">Home</a>
<a href="/events">Events</a>
<a href="/create">Create Event</a>
<a href="/attendees">Attendees</a>

<!-- NOT LOGGED IN -->

<span th:if="${loggedUser == null}">
<a href="/signin">Sign In</a>
<a href="/signup">Sign Up</a>
</span>

<!-- LOGGED IN -->

<span th:if="${loggedUser != null}">
<span style="color:#ff2ea6; margin-left:15px;">
👤 <span th:text="${loggedUser.name}"></span>
</span>
<a href="/logout" style="margin-left:15px;">Logout</a>
</span>

</div>

</div>

<!-- HEADER -->

<div class="header">
<div>
<h1>Explore Events</h1>
<p>Discover and manage all your events in one place</p>
</div>
</div>

<!-- EVENTS -->

<div class="events">

<div th:if="${#lists.isEmpty(events)}" style="text-align:center;">
No Events Available 🚫
</div>

<div class="card" th:each="e : ${events}">

<span class="badge"
   th:text="${e.status != null ? e.status : 'Upcoming'}"
   th:classappend="${e.status == 'Completed'} ? ' completed' : ' upcoming'"> </span>

<img src="https://images.unsplash.com/photo-1505236858219-8359eb29e329">

<div class="card-content">

<h3 th:text="${e.name}">Event Name</h3>

<p>
<span th:text="${e.date}"></span> • 
<span th:text="${e.location}"></span>
</p>

<p class="price"
   th:text="${e.ticketType == 'Free'} ? 'Free' : '₹' + e.price">
</p>

<a th:href="@{/register/{id}(id=${e.id})}" class="btn">
Register Now
</a>

<div class="admin-actions"
     th:if="${loggedUser != null and loggedUser.role == 'ADMIN'}">

<form th:action="@{/updateStatus/{id}(id=${e.id})}" method="post">
<input type="hidden" name="status" value="Upcoming">
<button class="btn btn-green">Upcoming</button>
</form>

<form th:action="@{/updateStatus/{id}(id=${e.id})}" method="post">
<input type="hidden" name="status" value="Completed">
<button class="btn btn-red">Completed</button>
</form>

<a th:href="@{'/deleteEvent/' + ${e.id}}"
onclick="return confirm('Are you sure you want to delete this event?')"> <button class="btn btn-red">Delete</button> </a>

</div>

</div>

</div>

</div>

</body>
</html>
