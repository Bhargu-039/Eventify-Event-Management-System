<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Sign In - Eventify</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

/* GLOBAL */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
background:linear-gradient(135deg,#0f0f1a,#1e1b4b);
color:white;
}

/* LEFT */
.left{
flex:1;
background:
linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.9)),
url("https://images.unsplash.com/photo-1492684223066-81342ee5ff30") center/cover;
display:flex;
flex-direction:column;
justify-content:center;
padding:60px;
}

.left h1{font-size:40px;}
.left p{opacity:0.8;margin-top:10px;}

/* RIGHT */
.right{
flex:1;
display:flex;
justify-content:center;
align-items:center;
}

/* CARD */
.card{
width:350px;
padding:35px;
border-radius:20px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(15px);
box-shadow:0 10px 40px rgba(0,0,0,0.5);
}

/* INPUT */
.input-box{
position:relative;
margin:25px 0;
}

.input-box input{
width:100%;
padding:12px;
background:transparent;
border:none;
border-bottom:2px solid #aaa;
color:white;
outline:none;
}

.input-box label{
position:absolute;
top:12px;
left:0;
font-size:14px;
color:#aaa;
transition:0.3s;
}

.input-box input:focus ~ label,
.input-box input:valid ~ label{
top:-10px;
font-size:12px;
color:#ff2ea6;
}

/* PASSWORD TOGGLE */
.toggle{
position:absolute;
right:0;
top:12px;
cursor:pointer;
}

/* OPTIONS */
.options{
display:flex;
justify-content:space-between;
font-size:13px;
}

/* BUTTON */
.btn{
width:100%;
margin-top:20px;
padding:12px;
border:none;
border-radius:30px;
background:linear-gradient(90deg,#6d28d9,#ff2ea6);
color:white;
cursor:pointer;
transition:0.3s;
}

.btn:hover{
transform:scale(1.05);
box-shadow:0 0 20px #ff2ea6;
}

/* ERROR */
.error{
color:#ef4444;
font-size:13px;
margin-top:10px;
text-align:center;
}

/* SIGNUP */
.signup{
text-align:center;
margin-top:20px;
}

.signup a{
color:#ff2ea6;
text-decoration:none;
}

/* FOOTER */
.footer{
position:absolute;
bottom:10px;
width:100%;
text-align:center;
font-size:12px;
opacity:0.6;
}

/* MOBILE */
@media(max-width:768px){
.left{display:none;}
}

</style>

</head>

<body>

<!-- LEFT -->
<div class="left">
<h1>Welcome Back to Your Event Hub</h1>
<p>Discover and manage events seamlessly</p>
</div>

<!-- RIGHT -->
<div class="right">

<div class="card">

<h2 style="text-align:center;">Sign In</h2>

<!-- ✅ FORM FIXED -->
<form th:action="@{/login}" method="post">

<div class="input-box">
<input type="email" name="email" required>
<label>Email</label>
</div>

<div class="input-box">
<input type="password" name="password" id="password" required>
<label>Password</label>
<span class="toggle" onclick="togglePass()">👁</span>
</div>

<div class="options">
<label><input type="checkbox"> Remember Me</label>
<a href="#">Forgot Password?</a>
</div>

<!-- ✅ SHOW ERROR ONLY IF EXISTS -->
<p class="error" th:if="${error}" th:text="${error}"></p>

<button type="submit" class="btn">Sign In</button>

</form>

<div class="signup">
Don't have an account? <a th:href="@{/signup}">Create Account</a>
</div>

</div>

</div>

<div class="footer">
<p>© 2026 Eventify</p>
</div>

<script>

// PASSWORD TOGGLE
function togglePass(){
let pass=document.getElementById("password");
pass.type = pass.type === "password" ? "text" : "password";
}

</script>

</body>
</html>
